<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<style>html,body{margin:0;background:#0A0A0B}#stage{width:1200px;height:675px;overflow:hidden}svg{display:block}</style>
</head>
<body>
<div id="stage"></div>
<script>
const W=1200,H=675;
const defs=`
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0d0d10"/><stop offset="1" stop-color="#151417"/>
  </linearGradient>
  <radialGradient id="glow" cx="26%" cy="50%" r="60%">
    <stop offset="0" stop-color="#C2832C" stop-opacity="0.30"/><stop offset="1" stop-color="#C2832C" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#B4761F"/><stop offset="1" stop-color="#E7B45A"/>
  </linearGradient>
  <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#20201f"/><stop offset="0.5" stop-color="#37342d"/><stop offset="1" stop-color="#1a1815"/>
  </linearGradient>
  <radialGradient id="ball" cx="38%" cy="34%" r="75%">
    <stop offset="0" stop-color="#4a4437"/><stop offset="0.6" stop-color="#2a2620"/><stop offset="1" stop-color="#141210"/>
  </radialGradient>
  <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="6"/></filter>
  <clipPath id="ballclip"><circle cx="0" cy="-150" r="78"/></clipPath>
</defs>`;

function dots(){let d='';for(let y=40;y<H-20;y+=46)for(let x=40;x<W-20;x+=46)d+=`<circle cx="${x}" cy="${y}" r="1.4"/>`;return d;}

// Front d'onde perturbé : arc ouvert vers la droite, rayon bruité.
function pwave(cx,cy,r,seed,amp,color,sw,op,dash){
  const pts=[];
  for(let a=-90;a<=90;a+=2.5){
    const rad=a*Math.PI/180;
    // perturbation douce (ondulation), pas de dents de scie
    const n=Math.sin(a*0.28+seed)*amp + Math.sin(a*0.63+seed*1.6)*amp*0.4;
    const rr=r+n;
    pts.push([cx+Math.cos(rad)*rr, cy+Math.sin(rad)*rr]);
  }
  // courbe lissée (Catmull-Rom -> Bézier)
  let d='M '+pts[0][0].toFixed(1)+' '+pts[0][1].toFixed(1);
  for(let i=0;i<pts.length-1;i++){
    const p0=pts[i-1]||pts[i], p1=pts[i], p2=pts[i+1], p3=pts[i+2]||p2;
    const c1x=p1[0]+(p2[0]-p0[0])/6, c1y=p1[1]+(p2[1]-p0[1])/6;
    const c2x=p2[0]-(p3[0]-p1[0])/6, c2y=p2[1]-(p3[1]-p1[1])/6;
    d+=` C ${c1x.toFixed(1)} ${c1y.toFixed(1)}, ${c2x.toFixed(1)} ${c2y.toFixed(1)}, ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`;
  }
  return `<path d="${d}" fill="none" stroke="${color}" stroke-width="${sw}" opacity="${op}" ${dash?`stroke-dasharray="${dash}"`:''} stroke-linecap="round" stroke-linejoin="round"/>`;
}
// Segment d'arc partiel (interférence) entre deux angles.
function pseg(cx,cy,r,a0,a1,seed,amp,color,sw,op){
  let d='';
  for(let a=a0;a<=a1;a+=3){
    const rad=a*Math.PI/180;
    const n=Math.sin(a*0.9+seed)*amp+Math.sin(a*2.1+seed)*amp*0.5;
    const rr=r+n;
    d+=(d?' L ':'M ')+(cx+Math.cos(rad)*rr).toFixed(1)+' '+(cy+Math.sin(rad)*rr).toFixed(1);
  }
  return `<path d="${d}" fill="none" stroke="${color}" stroke-width="${sw}" opacity="${op}" stroke-linecap="round" stroke-linejoin="round"/>`;
}

function micros(){
  const cx=300, cy=H/2+18;
  // ondes émises depuis le micro (centre = corps du micro), ouvertes vers la droite
  const ox=cx-6, oy=cy-90;
  let waves='';
  const rs=[130,205,285,370,460,555];
  rs.forEach((r,i)=>{
    const amp=5+i*5;                       // plus loin = plus perturbé
    waves+=pwave(ox,oy,r,i*1.3,amp,'url(#gold)',6-i*0.6,0.9-i*0.12);
  });
  // interférences rouges (segments brisés) + éclair
  let inter='';
  inter+=pseg(ox,oy,300,-40,10,2.0,14,'#d9503c',6,0.9);
  inter+=pseg(ox,oy,300,-40,10,2.0,14,'#f0705c',3,1);
  inter+=pseg(ox,oy,420,20,55,4.0,20,'#d9503c',5,0.75);
  // éclair (glitch)
  const gx=ox+300*Math.cos(-0.35), gy=oy+300*Math.sin(-0.35);
  const bolt=`M ${gx} ${gy} l 30 -10 l -16 30 l 34 -6 l -20 40 l 30 -2`;
  inter+=`<path d="${bolt}" fill="none" stroke="#d9503c" stroke-width="7" filter="url(#soft)"/>
          <path d="${bolt}" fill="none" stroke="#ffb0a3" stroke-width="4" stroke-linejoin="round"/>`;
  // grésillement : petits points de bruit
  let noise='';
  for(let i=0;i<26;i++){
    const a=(-50+Math.random()*90)*Math.PI/180, r=180+Math.random()*380;
    noise+=`<circle cx="${(ox+Math.cos(a)*r).toFixed(1)}" cy="${(oy+Math.sin(a)*r).toFixed(1)}" r="${(1+Math.random()*2).toFixed(1)}" fill="#e79b6a" opacity="${(0.15+Math.random()*0.4).toFixed(2)}"/>`;
  }

  // ---- Micro-main HF réaliste (silhouette type SM58) ----
  const R=78, cyb=-150;
  // maille losange : deux familles de lignes ±42° coupées au cercle de la grille
  let mesh='';
  for(const ang of [42,-42]){
    const rad=ang*Math.PI/180, dx=Math.cos(rad), dy=Math.sin(rad), px=-Math.sin(rad), py=Math.cos(rad), ext=R*1.7;
    for(let o=-R+2;o<=R-2;o+=12){
      const bx=px*o, by=py*o+cyb;
      mesh+=`<line x1="${(bx-dx*ext).toFixed(1)}" y1="${(by-dy*ext).toFixed(1)}" x2="${(bx+dx*ext).toFixed(1)}" y2="${(by+dy*ext).toFixed(1)}" stroke="#C2832C" stroke-width="1.7" opacity="0.55"/>`;
    }
  }
  const mic=`
  <g transform="translate(${cx},${cy}) rotate(-6)" filter="url(#soft0)">
    <ellipse cx="6" cy="188" rx="56" ry="18" fill="#000" opacity="0.35" filter="url(#soft)"/>
    <!-- corps tronconique (se resserre vers le bas) -->
    <path d="M -60 -64 L -44 150 L 44 150 L 60 -64 Z" fill="url(#steel)" stroke="url(#gold)" stroke-width="5" stroke-linejoin="round"/>
    <rect x="-30" y="-58" width="11" height="205" rx="6" fill="#fff" opacity="0.06"/>
    <!-- embout / culot -->
    <path d="M -50 146 L 50 146 L 46 184 Q 44 194 30 194 L -30 194 Q -44 194 -46 184 Z" fill="#1a1815" stroke="url(#gold)" stroke-width="4.5" stroke-linejoin="round"/>
    <!-- grip -->
    <g stroke="#0d0d10" stroke-width="3" opacity="0.45">
      <line x1="-44" y1="62" x2="44" y2="62"/><line x1="-42" y1="78" x2="42" y2="78"/><line x1="-40" y1="94" x2="40" y2="94"/>
    </g>
    <!-- LED d'état + écran -->
    <circle cx="0" cy="-30" r="7" fill="#7ee0a0"/><circle cx="0" cy="-30" r="12" fill="#7ee0a0" opacity="0.25"/>
    <rect x="-30" y="-6" width="60" height="34" rx="7" fill="#0d0d10" stroke="url(#gold)" stroke-width="2.5"/>
    <rect x="-22" y="3" width="30" height="6" rx="3" fill="#E7B45A" opacity="0.85"/>
    <rect x="-22" y="14" width="44" height="5" rx="2.5" fill="#4a453c"/>
    <!-- bague de col (2 anneaux) -->
    <rect x="-60" y="-84" width="120" height="24" rx="8" fill="url(#steel)" stroke="url(#gold)" stroke-width="4"/>
    <line x1="-54" y1="-77" x2="54" y2="-77" stroke="url(#gold)" stroke-width="2.5" opacity="0.9"/>
    <line x1="-54" y1="-67" x2="54" y2="-67" stroke="url(#gold)" stroke-width="2.5" opacity="0.9"/>
    <!-- tête grille bombée (large) -->
    <circle cx="0" cy="${cyb}" r="${R}" fill="url(#ball)"/>
    <g clip-path="url(#ballclip)">${mesh}</g>
    <circle cx="0" cy="${cyb}" r="${R}" fill="none" stroke="url(#gold)" stroke-width="5"/>
    <ellipse cx="-26" cy="-178" rx="24" ry="15" fill="#efe6d0" opacity="0.14"/>
  </g>`;

  return `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">
    ${defs}
    <filter id="soft0" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.5"/></filter>
    <rect width="${W}" height="${H}" fill="url(#bg)"/>
    <circle cx="320" cy="${H/2}" r="520" fill="url(#glow)"/>
    <g fill="#ffffff" opacity="0.05">${dots()}</g>
    ${waves}${noise}${inter}${mic}
    <rect x="0" y="${H-6}" width="${W}" height="6" fill="url(#gold)" opacity="0.9"/>
  </svg>`;
}
document.getElementById('stage').innerHTML=micros();
</script>
</body>
</html>
