<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<style>html,body{margin:0;background:#0A0A0B}#stage{width:1200px;height:675px;overflow:hidden}svg{display:block}</style>
</head>
<body>
<div id="stage"></div>
<script>
const W=1200,H=675;
const defs=`
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0d0d10"/><stop offset="1" stop-color="#151417"/>
  </linearGradient>
  <radialGradient id="glow" cx="24%" cy="52%" r="60%">
    <stop offset="0" stop-color="#C2832C" stop-opacity="0.28"/><stop offset="1" stop-color="#C2832C" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#B4761F"/><stop offset="1" stop-color="#E7B45A"/>
  </linearGradient>
  <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#20201f"/><stop offset="0.5" stop-color="#37342d"/><stop offset="1" stop-color="#1a1815"/>
  </linearGradient>
  <radialGradient id="ball" cx="38%" cy="34%" r="75%">
    <stop offset="0" stop-color="#4a4437"/><stop offset="0.6" stop-color="#2a2620"/><stop offset="1" stop-color="#141210"/>
  </radialGradient>
  <clipPath id="ballclip"><circle cx="0" cy="-150" r="78"/></clipPath>
  <filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="7"/></filter>
  <filter id="soft0" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.5"/></filter>
</defs>`;

function dots(){let d='';for(let y=40;y<H-20;y+=46)for(let x=40;x<W-20;x+=46)d+=`<circle cx="${x}" cy="${y}" r="1.4"/>`;return d;}

// arc PROPRE ouvert vers la droite
function arc(ox,oy,r,color,sw,op){
  const a0=-80*Math.PI/180, a1=80*Math.PI/180;
  const x0=ox+Math.cos(a0)*r, y0=oy+Math.sin(a0)*r;
  const x1=ox+Math.cos(a1)*r, y1=oy+Math.sin(a1)*r;
  return `<path d="M ${x0.toFixed(1)} ${y0.toFixed(1)} A ${r} ${r} 0 0 1 ${x1.toFixed(1)} ${y1.toFixed(1)}" fill="none" stroke="${color}" stroke-width="${sw}" opacity="${op}" stroke-linecap="round"/>`;
}
// arc SATURÉ (déformé) — lissé
function sarc(ox,oy,r,seed,amp,color,sw,op){
  const pts=[];
  for(let a=-80;a<=80;a+=2.5){
    const rad=a*Math.PI/180;
    const n=Math.sin(a*0.30+seed)*amp+Math.sin(a*0.7+seed*1.6)*amp*0.5;
    const rr=r+n;
    pts.push([ox+Math.cos(rad)*rr, oy+Math.sin(rad)*rr]);
  }
  let d='M '+pts[0][0].toFixed(1)+' '+pts[0][1].toFixed(1);
  for(let i=0;i<pts.length-1;i++){
    const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;
    const c1x=p1[0]+(p2[0]-p0[0])/6,c1y=p1[1]+(p2[1]-p0[1])/6;
    const c2x=p2[0]-(p3[0]-p1[0])/6,c2y=p2[1]-(p3[1]-p1[1])/6;
    d+=` C ${c1x.toFixed(1)} ${c1y.toFixed(1)}, ${c2x.toFixed(1)} ${c2y.toFixed(1)}, ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`;
  }
  return `<path d="${d}" fill="none" stroke="${color}" stroke-width="${sw}" opacity="${op}" stroke-linecap="round" stroke-linejoin="round"/>`;
}

function micDrawing(cx,cy){
  const R=78, cyb=-150;
  let mesh='';
  for(const ang of [42,-42]){
    const rad=ang*Math.PI/180, dx=Math.cos(rad), dy=Math.sin(rad), px=-Math.sin(rad), py=Math.cos(rad), ext=R*1.7;
    for(let o=-R+2;o<=R-2;o+=12){
      const bx=px*o, by=py*o+cyb;
      mesh+=`<line x1="${(bx-dx*ext).toFixed(1)}" y1="${(by-dy*ext).toFixed(1)}" x2="${(bx+dx*ext).toFixed(1)}" y2="${(by+dy*ext).toFixed(1)}" stroke="#C2832C" stroke-width="1.7" opacity="0.55"/>`;
    }
  }
  return `
  <g transform="translate(${cx},${cy})" filter="url(#soft0)">
    <ellipse cx="4" cy="190" rx="56" ry="18" fill="#000" opacity="0.35" filter="url(#soft)"/>
    <path d="M -60 -64 L -44 150 L 44 150 L 60 -64 Z" fill="url(#steel)" stroke="url(#gold)" stroke-width="5" stroke-linejoin="round"/>
    <rect x="-30" y="-58" width="11" height="205" rx="6" fill="#fff" opacity="0.06"/>
    <path d="M -50 146 L 50 146 L 46 184 Q 44 194 30 194 L -30 194 Q -44 194 -46 184 Z" fill="#1a1815" stroke="url(#gold)" stroke-width="4.5" stroke-linejoin="round"/>
    <g stroke="#0d0d10" stroke-width="3" opacity="0.45">
      <line x1="-44" y1="62" x2="44" y2="62"/><line x1="-42" y1="78" x2="42" y2="78"/><line x1="-40" y1="94" x2="40" y2="94"/>
    </g>
    <rect x="-60" y="-84" width="120" height="24" rx="8" fill="url(#steel)" stroke="url(#gold)" stroke-width="4"/>
    <line x1="-54" y1="-77" x2="54" y2="-77" stroke="url(#gold)" stroke-width="2.5" opacity="0.9"/>
    <line x1="-54" y1="-67" x2="54" y2="-67" stroke="url(#gold)" stroke-width="2.5" opacity="0.9"/>
    <circle cx="0" cy="${cyb}" r="${R}" fill="url(#ball)"/>
    <g clip-path="url(#ballclip)">${mesh}</g>
    <circle cx="0" cy="${cyb}" r="${R}" fill="none" stroke="url(#gold)" stroke-width="5"/>
    <ellipse cx="-26" cy="-178" rx="24" ry="15" fill="#efe6d0" opacity="0.14"/>
  </g>`;
}

function micros(){
  const cx=248, cy=H/2+52;
  const ox=cx, oy=cy-96;                 // les ondes partent de la tête du micro

  // ondes propres (près du micro)
  let clean = arc(ox,oy,150,'url(#gold)',6,0.95)
            + arc(ox,oy,232,'url(#gold)',5.5,0.85)
            + arc(ox,oy,316,'url(#gold)',5,0.72);

  // ondes saturées (déformées) — là où l'éclair frappe
  let sat = sarc(ox,oy,406,1,18,'#e0552f',5,0.9)
          + sarc(ox,oy,498,2,24,'#d9503c',4.5,0.72)
          + sarc(ox,oy,592,3,30,'#c0442f',4,0.5);

  // éclair qui descend et frappe les ondes
  const bolt="M 726 -20 L 690 150 L 762 196 L 700 340 L 772 392 L 706 560 L 738 700";
  const fork="M 762 196 L 812 250 L 786 292";
  const light=`
    <path d="${bolt}" fill="none" stroke="#E7B45A" stroke-width="18" opacity="0.45" filter="url(#soft)"/>
    <path d="${bolt}" fill="none" stroke="#ffdf9a" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="${bolt}" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linejoin="round" opacity="0.9"/>
    <path d="${fork}" fill="none" stroke="#ffdf9a" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- points d'impact -->
    <circle cx="700" cy="340" r="16" fill="#ffdf9a" opacity="0.55" filter="url(#soft)"/>
    <circle cx="762" cy="196" r="13" fill="#ffdf9a" opacity="0.5" filter="url(#soft)"/>`;

  return `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">
    ${defs}
    <rect width="${W}" height="${H}" fill="url(#bg)"/>
    <circle cx="300" cy="${H/2}" r="520" fill="url(#glow)"/>
    <g fill="#ffffff" opacity="0.05">${dots()}</g>
    ${clean}${sat}${light}
    ${micDrawing(cx,cy)}
    <rect x="0" y="${H-6}" width="${W}" height="6" fill="url(#gold)" opacity="0.9"/>
  </svg>`;
}
document.getElementById('stage').innerHTML=micros();
</script>
</body>
</html>
